# Cấu hình triển khai Render (Infrastructure as Code)
# Xem: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nihongo-kizuna-api
    runtime: node
    plan: free
    region: singapore
    # PHẢI có --include=dev: Render đặt NODE_ENV=production, mà khi thấy biến đó
    # npm sẽ bỏ qua devDependencies — nơi `typescript` nằm. Thiếu cờ này thì
    # `tsc` không được cài, build thất bại lặng lẽ và `node dist/server.js`
    # báo "Cannot find module".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Các biến bên dưới phải điền thủ công trong Render Dashboard
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_PROVIDER
        value: console
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
